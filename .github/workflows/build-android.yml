name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Verify Android SDK components
        run: |
          test -n "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          command -v sdkmanager
          sdkmanager --version
          test -d "${ANDROID_SDK_ROOT:-${ANDROID_HOME}}/platforms/android-34"
          test -x "${ANDROID_SDK_ROOT:-${ANDROID_HOME}}/build-tools/34.0.0/aapt"

      - name: Verify Gradle environment
        run: ./gradlew --version

      - name: Build debug APK
        run: ./gradlew clean assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
